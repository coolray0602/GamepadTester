<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta charset="UTF-8">
		<title>左搖桿測試結果</title>
		<style>
			body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; }
			table { width: 100%; border-collapse: collapse; margin-top: 20px; }
			th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
			th { background-color: #f2f2f2; }
			.header-group { 
				text-align: center;
				vertical-align: middle;
				background-color: #D8E4BC; /* 淺綠色 */
			}
			.y-axis-header {
				background-color: #FFF2CC; /* 淺黃色 */
			}
			.sub-header {
				background-color: #F2F2F2; /* 淺灰色 */
				font-weight: bold;
			}
			button { margin-top: 20px; padding: 8px 16px; margin-right: 10px; }
			.button-group { margin-top: 20px; }
		</style>
		<script src="src/xlsx.full.min.js"></script>
	</head>
	<body>
		<h1>左搖桿測試結果</h1>
		
		<div id="resultsTable"></div>
		
		<div class="button-group">
			<button id="exportExcel">導出 Excel</button>
			<button id="clearData">清空所有數據</button>
			<a href="index.html">返回輸入頁面</a>
		</div>
		
		<script>
			function displayResults() {
				const savedResults = JSON.parse(localStorage.getItem('testResults')) || [];
				const tableContainer = document.getElementById('resultsTable');
				
				if (savedResults.length === 0) {
					tableContainer.innerHTML = '<p>沒有保存的測試結果。</p>';
					return;
				}
				
				let html = '<table>';
				
				// 第一行表頭
				html += '<tr>';
				html += '<th rowspan="2">時間</th>';
				html += '<th colspan="7" class="header-group">左搖桿X軸</th>';
				html += '<th colspan="7" class="header-group y-axis-header">左搖桿Y軸</th>';
				html += '</tr>';
				
				// 第二行表頭
				html += '<tr class="sub-header">';
				html += '<th>中心分壓%</th>';
				html += '<th>最大分壓%</th>';
				html += '<th>最小分壓%</th>';
				html += '<th>左複歸%</th>';
				html += '<th>右複歸%</th>';
				html += '<th>複歸精度%</th>';
				html += '<th>滑動雜訊mV</th>';
				html += '<th>中心分壓%</th>';
				html += '<th>最大分壓%</th>';
				html += '<th>最小分壓%</th>';
				html += '<th>上複歸%</th>';
				html += '<th>下複歸%</th>';
				html += '<th>複歸精度%</th>';
				html += '<th>滑動雜訊mV</th>';
				html += '</tr>';
				
				// 數據列
				savedResults.forEach(result => {
					html += `<tr><td>${result.timestamp}</td>`;
					for (let i = 1; i <= 14; i++) {
						html += `<td>${result[`data${i}`]}</td>`;
					}
					html += '</tr>';
				});
				
				html += '</table>';
				tableContainer.innerHTML = html;
			}
			
			document.getElementById('clearData').addEventListener('click', function() {
				if (confirm('確定要清空所有數據嗎？此操作無法撤銷。')) {
					localStorage.removeItem('testResults');
					displayResults();
					alert('所有數據已清空。');
				}
			});
			
			document.getElementById('exportExcel').addEventListener('click', function() {
				const savedResults = JSON.parse(localStorage.getItem('testResults')) || [];
				
				if (savedResults.length === 0) {
					alert('沒有數據可導出！');
					return;
				}
				
				// 準備表格資料
				const wsData = [
					['', '左搖桿X軸', '', '', '', '', '', '', '左搖桿Y軸', '', '', '', '', '', ''],
					['時間', '中心分壓', '最大分壓', '最小分壓', '左複歸', '右複歸', '複歸精度','滑動雜訊', 
					 '中心分壓', '最大分壓', '最小分壓', '上複歸', '下複歸', '複歸精度','滑動雜訊']
				];
				
				// 填入數據
				savedResults.forEach(result => {
					wsData.push([
						result.timestamp,
						Number(result.data1),
						Number(result.data2),
						Number(result.data3),
						Number(result.data4),
						Number(result.data5),
						Number(result.data6),
						Number(result.data7),
						Number(result.data8),
						Number(result.data9),
						Number(result.data10),
						Number(result.data11),
						Number(result.data12),
						Number(result.data13),
						Number(result.data14)
					]);
				});
				
				const ws = XLSX.utils.aoa_to_sheet(wsData);
				
				// 合併儲存格
				ws['!merges'] = [
					// B1:H1 (X軸)
					{ s: { r: 0, c: 1 }, e: { r: 0, c: 7 } },
					// I1:O1 (Y軸)
					{ s: { r: 0, c: 8 }, e: { r: 0, c: 14 } }
				];
				
				// 樣式
				const borderStyle = {
					top: { style: 'thin', color: { rgb: "000000" } },
					bottom: { style: 'thin', color: { rgb: "000000" } },
					left: { style: 'thin', color: { rgb: "000000" } },
					right: { style: 'thin', color: { rgb: "000000" } }
				};
				
				const xAxisHeaderStyle = {
					alignment: { horizontal: 'center', vertical: 'center' },
					font: { bold: true, sz: 12 },
					fill: { fgColor: { rgb: "D8E4BC" } },
					border: borderStyle
				};
				
				const yAxisHeaderStyle = {
					...xAxisHeaderStyle,
					fill: { fgColor: { rgb: "FFF2CC" } }
				};
				
				const subHeaderStyle = {
					font: { bold: true },
					fill: { fgColor: { rgb: "F2F2F2" } },
					border: borderStyle
				};
				
				ws['B1'] = { v: '左搖桿X軸', t: 's', s: xAxisHeaderStyle };
				ws['I1'] = { v: '左搖桿Y軸', t: 's', s: yAxisHeaderStyle };
				
				for (let col = 0; col <= 14; col++) {
					const addr = XLSX.utils.encode_cell({ r: 1, c: col });
					if (ws[addr]) ws[addr].s = subHeaderStyle;
				}
				
				// 數據樣式
				const range = XLSX.utils.decode_range(ws['!ref']);
				for (let r = 2; r <= range.e.r; r++) {
					for (let c = 1; c <= 14; c++) {
						const addr = XLSX.utils.encode_cell({ r, c });
						if (ws[addr]) {
							ws[addr].t = 'n';
							ws[addr].z = '0.00';
							ws[addr].s = { border: borderStyle };
						}
					}
				}
				
				ws['!cols'] = [{ wch: 20 }, ...Array(14).fill({ wch: 12 })];
				
				const wb = XLSX.utils.book_new();
				XLSX.utils.book_append_sheet(wb, ws, '測試結果');
				
				const fileName = `測試結果_${new Date().toISOString().slice(0, 10)}.xlsx`;
				XLSX.writeFile(wb, fileName);
			});
			
			displayResults();
		</script>
	</body>
</html>
