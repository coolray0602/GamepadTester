<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>右搖桿測試結果</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1600px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .header-group { 
            text-align: center;
            vertical-align: middle;
            background-color: #D8E4BC; /* 淺綠色 */
        }
        .y-axis-header {
            background-color: #FFF2CC; /* 淺黃色 */
        }
        .sub-header {
            background-color: #F2F2F2; /* 淺灰色 */
            font-weight: bold;
        }
        button { margin-top: 20px; padding: 8px 16px; margin-right: 10px; }
        .button-group { margin-top: 20px; }
    </style>
    <!-- 引入 SheetJS 庫 -->
    <script src="src/xlsx.full.min.js"></script>
</head>
<body>
    <h1>右搖桿測試結果</h1>
    
    <div id="resultsTable"></div>
    
    <div class="button-group">
        <button id="exportExcel">導出 Excel</button>
        <button id="clearData">清空所有數據</button>
        <a href="index.html">返回輸入頁面</a>
    </div>
    
    <script>
        // 顯示數據（添加合併儲存格）
        function displayResults() {
            const savedResults = JSON.parse(localStorage.getItem('testResults2')) || [];
            const tableContainer = document.getElementById('resultsTable');
            
            if (savedResults.length === 0) {
                tableContainer.innerHTML = '<p>沒有保存的測試結果。</p>';
                return;
            }
            
            let html = '<table>';
            
            // 第一行表頭（合併儲存格）
            html += '<tr>';
            html += '<th rowspan="2">時間</th>';
            html += '<th colspan="6" class="header-group">右搖桿X軸</th>';
            html += '<th colspan="6" class="header-group y-axis-header">右搖桿Y軸</th>';
            html += '</tr>';
            
            // 第二行表頭（詳細標題）
            html += '<tr class="sub-header">';
            html += '<th>中心分壓</th>';
            html += '<th>最大分壓</th>';
            html += '<th>最小分壓</th>';
            html += '<th>左複歸</th>';
            html += '<th>右複歸</th>';
            html += '<th>複歸精度</th>';
            html += '<th>中心分壓</th>';
            html += '<th>最大分壓</th>';
            html += '<th>最小分壓</th>';
            html += '<th>上複歸</th>';
            html += '<th>下複歸</th>';
            html += '<th>複歸精度</th>';
            html += '</tr>';
            
            // 數據行
            savedResults.forEach(result => {
                html += `<tr><td>${result.timestamp}</td>`;
                html += `<td>${result.data1}</td>`;
                html += `<td>${result.data2}</td>`;
                html += `<td>${result.data3}</td>`;
                html += `<td>${result.data4}</td>`;
                html += `<td>${result.data5}</td>`;
                html += `<td>${result.data6}</td>`;
                html += `<td>${result.data7}</td>`;
                html += `<td>${result.data8}</td>`;
                html += `<td>${result.data9}</td>`;
                html += `<td>${result.data10}</td>`;
                html += `<td>${result.data11}</td>`;
                html += `<td>${result.data12}</td></tr>`;
            });
            
            html += '</table>';
            tableContainer.innerHTML = html;
        }
        
        // 清空數據
        document.getElementById('clearData').addEventListener('click', function() {
            if (confirm('確定要清空所有數據嗎？此操作無法撤銷。')) {
                localStorage.removeItem('testResults2');
                displayResults(); // 刷新顯示
                alert('所有數據已清空。');
            }
        });
        
        // 導出 Excel (添加合併儲存格標題)
        document.getElementById('exportExcel').addEventListener('click', function() {
            const savedResults = JSON.parse(localStorage.getItem('testResults2')) || [];
            
            if (savedResults.length === 0) {
                alert('沒有數據可導出！');
                return;
            }
            
            // 準備工作表數據
            const wsData = [
                // 第一行: 合併儲存格標題 (時間列留空)
                ['', '左搖桿X軸', '', '', '', '', '', '左搖桿Y軸', '', '', '', '', ''],
                // 第二行: 詳細表頭
                ['時間', '中心分壓', '最大分壓', '最小分壓', '左複歸', '右複歸', '複歸精度', 
                 '中心分壓', '最大分壓', '最小分壓', '左複歸', '右複歸', '複歸精度']
            ];
            
            // 添加數據行，確保數值轉換為數字
            savedResults.forEach(result => {
                wsData.push([
                    result.timestamp,
                    Number(result.data1),
                    Number(result.data2),
                    Number(result.data3),
                    Number(result.data4),
                    Number(result.data5),
                    Number(result.data6),
                    Number(result.data7),
                    Number(result.data8),
                    Number(result.data9),
                    Number(result.data10),
                    Number(result.data11),
                    Number(result.data12)
                ]);
            });
            
            // 創建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            
            // 設置合併儲存格
            ws['!merges'] = [
                // 左搖桿X軸合併儲存格 (B1:G1)
                { s: { r: 0, c: 1 }, e: { r: 0, c: 6 } },
                // 左搖桿Y軸合併儲存格 (H1:M1)
                { s: { r: 0, c: 7 }, e: { r: 0, c: 12 } }
            ];
            
            // 定義樣式
            const xAxisHeaderStyle = {
                alignment: { horizontal: 'center', vertical: 'center' },
                font: { bold: true, sz: 12 },
                fill: { fgColor: { rgb: "D8E4BC" } }, // 淺綠色
                border: {
                    top: { style: 'thin', color: { rgb: "000000" } },
                    bottom: { style: 'thin', color: { rgb: "000000" } },
                    left: { style: 'thin', color: { rgb: "000000" } },
                    right: { style: 'thin', color: { rgb: "000000" } }
                }
            };
            
            const yAxisHeaderStyle = {
                ...xAxisHeaderStyle,
                fill: { fgColor: { rgb: "FFF2CC" } } // 淺黃色
            };
            
            const subHeaderStyle = {
                font: { bold: true },
                fill: { fgColor: { rgb: "F2F2F2" } }, // 淺灰色
                border: {
                    top: { style: 'thin', color: { rgb: "000000" } },
                    bottom: { style: 'thin', color: { rgb: "000000" } },
                    left: { style: 'thin', color: { rgb: "000000" } },
                    right: { style: 'thin', color: { rgb: "000000" } }
                }
            };
            
            // 應用樣式到合併儲存格
            ws['B1'] = {
                v: '左搖桿X軸',
                t: 's',
                s: xAxisHeaderStyle
            };
            
            ws['H1'] = {
                v: '左搖桿Y軸',
                t: 's',
                s: yAxisHeaderStyle
            };
            
            // 應用樣式到詳細表頭 (第二行)
            for (let col = 0; col < 13; col++) {
                const cellAddress = XLSX.utils.encode_cell({ r: 1, c: col });
                if (ws[cellAddress]) {
                    ws[cellAddress].s = {
                        ...(ws[cellAddress].s || {}),
                        ...subHeaderStyle
                    };
                }
            }
            
            // 設置數值列的單元格格式為數字
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let row = 2; row <= range.e.r; row++) { // 從第3行開始是數據
                for (let col = 1; col <= 12; col++) { // 從第2列到第13列是數值列
                    const cellAddress = XLSX.utils.encode_cell({ r: row, c: col });
                    if (ws[cellAddress]) {
                        ws[cellAddress].t = 'n'; // 設置單元格類型為數字
                        ws[cellAddress].z = '0.00'; // 設置數字格式為兩位小數
                        ws[cellAddress].s = {
                            ...(ws[cellAddress].s || {}),
                            border: {
                                top: { style: 'thin', color: { rgb: "000000" } },
                                bottom: { style: 'thin', color: { rgb: "000000" } },
                                left: { style: 'thin', color: { rgb: "000000" } },
                                right: { style: 'thin', color: { rgb: "000000" } }
                            }
                        };
                    }
                }
            }
            
            // 設置列寬
            ws['!cols'] = [
                { wch: 20 }, // 時間列寬
                { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 },
                { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }
            ];
            
            // 創建工作簿
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "測試結果");
            
            // 導出文件
            const fileName = `測試結果_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
        });
        
        // 初始顯示
        displayResults();
    </script>
</body>
</html>
