<!doctype html>

<html lang="zh">
    <head>
        <meta charset="utf-8">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">

        <title data-key="header">Ray's Gamepad Tester</title>
		<link rel="icon" href="images\logo2.png">
        <!-- CSS FILES -->                
        <link href="css/bootstrap.min.css" rel="stylesheet">

        <link href="css/bootstrap-icons.css" rel="stylesheet">

        <link href="css/custom.css" rel="stylesheet">
<style>
    table {
        width: 550px;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
        font-family: sans-serif;
    }
    th, td {
        border: none;
        padding: 4px 6px;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    thead {
        font-weight: bold;
        background-color: #f0f0f0;
    }
    tbody tr:nth-child(odd) {
        background-color: #fafafa;
    }

    th:nth-child(1), td:nth-child(1) { width: 30px; }   /* 名次 */
    th:nth-child(2), td:nth-child(2) { width: 100px; }  /* 姓名 */
    th:nth-child(3), td:nth-child(3) { width: 100px; }   /* 分數 */
    th:nth-child(4), td:nth-child(4) { width: 100px; }  /* 時間 */
    th:nth-child(5), td:nth-child(5) { width: 220px; }  /* 留言 */

    #formPopup {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      z-index: 9999;
    }
    #overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9998;
    }
</style>
    </head>
    <body>
        <main>
            <nav class="navbar navbar-expand-lg ">                
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center" href="index.html">
                        <img src="images/logo.png" class="navbar-brand-image img-fluid" alt="Ray Tester">
                        <span class="navbar-brand-text">
                            RAY
                            <small>Gamepad</small>
							<small>Tester</small>
                        </span>
                    </a>

    
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
    
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-lg-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html" data-key="home">Home</a>
                            </li>
    
                            <li class="nav-item">
                                <a class="nav-link" href="oscilloscope.html" data-key="oscilloscope">Oscilloscope</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="linearity.html" data-key="linearity">Linearity</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="https://www.favorunion.com/test/game.html" data-key="game">Game</a>
                            </li>

							<li class="nav-item">
                                <a  class="nav-link" href="#" onclick="switchLanguage('en')">English</a> | <a  class="nav-link" href="#" onclick="switchLanguage('zh')">中文</a>
                            </li>

                        </ul>

                    </div>
                </div>
            </nav>

            

            <section class="hero-section" >
                <div class="container">
                    <div class="row">
						<div class="col-8 text-center">
								<canvas id="joystickBtns" height="190" width="400"></canvas>
								<canvas id="gamepadImg" height="250" width="300"></canvas>
						</div>
						<div class="col-4">
							<div id="vibe1" class="section-bg-image-block">		
								① <label id="joystickConnectionTime0"></label><label id="joystickConnection0"></label>
							</div>
							<div id="vibe2" class="section-bg-image-block">
								② <label id="joystickConnectionTime1"></label><label id="joystickConnection1"></label>
							</div>
							<div id="vibe3" class="section-bg-image-block">
								③ <label id="joystickConnectionTime2"></label><label id="joystickConnection2"></label>
							</div>
							<div id="vibe4" class="section-bg-image-block">
								④ <label id="joystickConnectionTime3"></label><label id="joystickConnection3"></label>
							</div>
							<h5 class="white-font">FPS: <label id="fps"></label></h5>
						</div>
					</div>
                </div>
            </section>
            <br>
            <div style="width:1600px; display:flex; margin: 0 auto;">
                <div style="height:1000px; position: relative; width: 1000px;">
                    <canvas id="map" style="border:1px solid; position: absolute; left: 0; top: 0;" width="1000" height="1000"></canvas>
                    <canvas id="left-joystick" style="border:1px solid; position: absolute; left: 0; top: 0;" width="1000" height="1000"></canvas>
                    <canvas id="left-joystick-track" style="border:1px solid; position: absolute; left: 0; top: 0;" width="1000" height="1000"></canvas>
                </div>
                <div style="width: 600px; padding: 10px;">
                    <h2 style="text-align: center;">排行榜</h2>
                    <table id="scoreTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th style="text-align: center;">姓名</th>
                                <th style="text-align: center;">用時(秒)</th>
                                <th style="text-align: center;">時間</th>
                                <th style="text-align: center;">留言</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JavaScript 插入資料 -->
                        </tbody>
                    </table>
                </div>
            </div>	
            <div style="width:1600px; display:flex; margin: 0 auto;">
                顯示軌跡 <input type="checkbox" id="track0" checked>&emsp;&emsp; X軸對調方向 <input type="checkbox" id="xOpposite"> &emsp;&emsp; Y軸對調方向 <input type="checkbox" id="yOpposite"> 
            </div>

            <div id="overlay" onclick="closeForm()"></div>

            <div id="formPopup">
                太好了，您過關了！用時：
                <label id="usedTime"></label>秒
                <br>
                <br>
                <label>姓名：<input type="text" id="name" style="width: 100px;"></label><br><br>
                <label>留言：<input type="text" id="comment" style="width: 200px;"></label><br><br>
                <button id="submitBtn" onclick="submitScore()">送出</button>
                <button onclick="closeForm()">取消</button>
                <p id="resultMsg"></p>
            </div>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/jquery.sticky.js"></script>		
        <script src="js/animated-headline.js"></script>
        <script src="js/modernizr.js"></script>
        <script src="js/custom.js"></script>

</html>
